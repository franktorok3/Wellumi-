schema_version: 1
standard:
  repository: franktorok3/Project-Setup
  ref: main
project:
  name: Wellumi-
  lifecycle: prototype
  framework: expo
  runtime: node
  node_version: "22"
quality_gates:
  lockfile_required: true
  lint: optional
  typecheck: optional
  tests: optional
  build: platform-gated
  dependency_audit: report
operations:
  deployment: expo
  analytics: none
  data_store: none
  helicarrier: planned
security:
  secrets_in_repository: prohibited
  production_changes_via_pull_request: required
  missing_evidence_is_healthy: false
